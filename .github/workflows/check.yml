name: check

on:
  push:
  pull_request:

jobs:
  lean:
    name: Lean proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan + Lean
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check proofs
        run: lean lease/LeaseTier.lean

  tlc:
    name: TLC model checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Fetch TLC
        run: |
          curl -sSfL -o tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/latest/download/tla2tools.jar
      - name: Well-formed registry — every invariant holds
        working-directory: lease
        run: java -cp ../tla2tools.jar tlc2.TLC -workers auto -config MCLeaseTier.cfg MCLeaseTier.tla
      - name: Poisoned registry — the attack must still be found
        working-directory: lease
        run: |
          set +e
          java -cp ../tla2tools.jar tlc2.TLC -workers auto \
            -config MCLeaseTierMisconfig.cfg MCLeaseTierMisconfig.tla | tee tlc-misconfig.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 12 ]; then
            echo "Expected TLC exit 12 (invariant violated), got $code" >&2
            exit 1
          fi
          grep -q "Invariant AttackerNeverHolds is violated" tlc-misconfig.log
