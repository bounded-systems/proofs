name: check

on:
  push:
  pull_request:

jobs:
  lean:
    name: Lean proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Install elan + Lean
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check proofs
        run: |
          lean lease/LeaseTier.lean
          lean ci-state/CiState.lean

  tlc:
    name: TLC model checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Fetch TLC
        run: |
          curl -sSfL -o tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/latest/download/tla2tools.jar
      - name: Well-formed registry — every invariant holds
        working-directory: lease
        run: java -cp ../tla2tools.jar tlc2.TLC -workers auto -config MCLeaseTier.cfg MCLeaseTier.tla
      - name: Poisoned registry — the attack must still be found
        working-directory: lease
        run: |
          set +e
          java -cp ../tla2tools.jar tlc2.TLC -workers auto \
            -config MCLeaseTierMisconfig.cfg MCLeaseTierMisconfig.tla | tee tlc-misconfig.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 12 ]; then
            echo "Expected TLC exit 12 (invariant violated), got $code" >&2
            exit 1
          fi
          grep -q "Invariant AttackerNeverHolds is violated" tlc-misconfig.log
      - name: Coherent CI observations — confluence holds over every order
        working-directory: ci-state
        run: java -cp ../tla2tools.jar tlc2.TLC -workers auto -config MCCiState.cfg MCCiState.tla
      - name: Reused run id — the order-dependence must still be found
        working-directory: ci-state
        run: |
          set +e
          java -cp ../tla2tools.jar tlc2.TLC -workers auto \
            -config MCCiStateIncoherent.cfg MCCiStateIncoherent.tla | tee tlc-incoherent.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 12 ]; then
            echo "Expected TLC exit 12 (invariant violated), got $code" >&2
            exit 1
          fi
          grep -q "Invariant Confluent is violated" tlc-incoherent.log
